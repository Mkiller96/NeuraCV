# Render Blueprint - NeuraCV Backend
# ============================
# Pasos para desplegar:
# 1. Ve a https://dashboard.render.com
# 2. Clic en "New +" > "Blueprint"
# 3. Conecta tu repositorio GitHub: Mkiller96/NeuraCV
# 4. Render leerá este archivo automáticamente
# 5. Antes del deploy, configura los campos marcados como "sync: false"
# ============================

services:
  - type: web
    name: neuracy-api
    runtime: docker
    repo: https://github.com/Mkiller96/NeuraCV
    rootDir: backend
    region: ohio
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      # ==========================================
      # Variables que DEBES configurar manualmente
      # en el Dashboard de Render ANTES del deploy
      # ==========================================
      - key: APP_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # ==========================================
      # Variables fijas (no necesitan cambios)
      # ==========================================
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://neuracy-api.onrender.com
      - key: APP_LOCALE
        value: es
      - key: APP_NAME
        value: NeuroCV
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: es_ES
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: 120
      - key: SESSION_DOMAIN
        value: .neurocv.net
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file
      - key: DB_SSLMODE
        value: require
      - key: FRONTEND_URL
        value: https://www.neurocv.net
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtps
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_FROM_ADDRESS
        value: noreply@neurocv.net
      - key: MAIL_FROM_NAME
        value: NeuroCV
      - key: SANCTUM_STATEFUL_DOMAINS
        value: neurocv.net,www.neurocv.net,localhost:3000
